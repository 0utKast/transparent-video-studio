<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TransparentVideo Side Panel</title>
  <script type="module" crossorigin src="../assets/sidepanel-BEUvgH3W.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/export-manager-BpGeN5yQ.js">
  <link rel="stylesheet" crossorigin href="../assets/sidepanel-CZUGki2Y.css">
</head>
<body class="sidepanel-body">
  <header class="sidepanel-header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M5.5 21v-2a6.5 6.5 0 0 1 13 0v2"></path>
          <path d="M19 11l3-3m0 0l-3-3m3 3H15"></path>
        </svg>
      </div>
      <div>
        <h2>TransparentVideo</h2>
        <span class="subtext">BrowserOS Alpha Engine</span>
      </div>
    </div>
    <button class="btn btn-icon" id="btn-open-studio" title="Abrir en Pantalla Completa">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 3h6v6m-11 5L21 3m-3 18H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"></path>
      </svg>
    </button>
  </header>

  <main class="sidepanel-main">
    <!-- Viewport -->
    <div class="viewport-box">
      <canvas id="sp-canvas" width="640" height="360"></canvas>
      <div class="sp-telemetry" id="sp-telemetry">
        <span id="sp-fps">60 FPS</span>
        <span class="dot">•</span>
        <span id="sp-engine">WebGPU</span>
      </div>
    </div>

    <!-- Quick Action Bar -->
    <div class="action-row">
      <button class="btn btn-primary btn-block" id="btn-sp-record">
        <span class="rec-dot"></span>
        <span id="sp-rec-label">Grabar WebM Alfa</span>
      </button>
      <button class="btn btn-secondary btn-icon" id="btn-sp-snapshot" title="Capturar PNG Transparente">
        📸
      </button>
    </div>

    <!-- Sources -->
    <div class="card">
      <div class="card-title">Fuente de Vídeo</div>
      <div class="source-grid">
        <button class="source-btn active" data-source="demo">⚡ Demo</button>
        <button class="source-btn" data-source="webcam">📷 Webcam</button>
        <button class="source-btn" data-source="file">📁 Archivo</button>
      </div>
      <input type="file" id="sp-file-picker" accept="video/*" style="display: none;">
    </div>

    <!-- Background -->
    <div class="card">
      <div class="card-title">Fondo</div>
      <div class="bg-grid">
        <button class="bg-btn active" data-bg="transparent">🏁 Damero</button>
        <button class="bg-btn" data-bg="green">🟩 Croma</button>
        <button class="bg-btn" data-bg="cyberpunk">🌆 Virtual</button>
      </div>
    </div>

    <!-- Edge Tuning -->
    <div class="card">
      <div class="card-title">Ajuste de Borde</div>
      
      <div class="slider-row">
        <div class="slider-header">
          <span>Umbral</span>
          <span id="sp-val-thresh">35%</span>
        </div>
        <input type="range" id="sp-slider-thresh" min="0" max="100" value="35">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>Suavizado</span>
          <span id="sp-val-feather">15%</span>
        </div>
        <input type="range" id="sp-slider-feather" min="0" max="100" value="15">
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>Despill (Anti-Halos)</span>
          <span id="sp-val-despill">75%</span>
        </div>
        <input type="range" id="sp-slider-despill" min="0" max="100" value="75">
      </div>
    </div>

    <!-- Smurf Toggle -->
    <div class="card smurf-card">
      <label class="smurf-label">
        <input type="checkbox" id="sp-check-smurf">
        <span>🫐 Simular Efecto Pitufo (OpenCV BGR Bug)</span>
      </label>
    </div>
  </main>

</body>
</html>
